# Opt-in single-node Elasticsearch for the live-ES path (security disabled for
# local dev only). Not required for the offline demo (`make demo`).
#   docker compose up -d
#   raptorscope ingest samples/mac-victim --es http://localhost:9200
#   raptorscope serve --es http://localhost:9200
services:
  elasticsearch:
    image: docker.elastic.co/elasticsearch/elasticsearch:8.13.4
    container_name: raptorscope-es
    environment:
      - discovery.type=single-node
      - xpack.security.enabled=false
      - ES_JAVA_OPTS=-Xms1g -Xmx1g
    ports:
      - "9200:9200"
    healthcheck:
      test: ["CMD-SHELL", "curl -s http://localhost:9200/_cluster/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 12
