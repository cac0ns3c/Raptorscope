# Local dev/deploy stack (Elasticsearch security disabled — local use only).
#
#   docker compose up -d                     # just ES + Kibana (data store)
#   docker compose --profile app up -d --build   # + ingest sample, API, and SPA
#
# With the "app" profile: ingest seeds ES from the bundled sample, the API serves
# from ES, and the SPA is served at http://localhost:8080 (proxying /api -> api).
services:
  elasticsearch:
    image: docker.elastic.co/elasticsearch/elasticsearch:8.13.4
    container_name: raptorscope-es
    environment:
      - discovery.type=single-node
      - xpack.security.enabled=false
      - ES_JAVA_OPTS=-Xms1g -Xmx1g
    ports:
      - "9200:9200"
    healthcheck:
      test: ["CMD-SHELL", "curl -s http://localhost:9200/_cluster/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 12

  kibana:
    image: docker.elastic.co/kibana/kibana:8.13.4
    container_name: raptorscope-kibana
    depends_on:
      elasticsearch:
        condition: service_healthy
    environment:
      - ELASTICSEARCH_HOSTS=http://elasticsearch:9200
    ports:
      - "5601:5601"
    healthcheck:
      test: ["CMD-SHELL", "curl -s http://localhost:5601/api/status || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 24

  # --- application tier (opt in with: --profile app) ---
  ingest:
    profiles: ["app"]
    build: .
    depends_on:
      elasticsearch:
        condition: service_healthy
    command: ["raptorscope", "ingest", "samples/mac-victim", "--es", "http://elasticsearch:9200"]
    restart: "no"

  api:
    profiles: ["app"]
    build: .
    depends_on:
      ingest:
        condition: service_completed_successfully
    command: ["raptorscope", "serve", "--es", "http://elasticsearch:9200", "--host", "0.0.0.0", "--port", "8000"]
    ports:
      - "8000:8000"

  web:
    profiles: ["app"]
    build:
      context: ./web
      args:
        VITE_KIBANA_URL: http://localhost:5601
    depends_on:
      - api
    ports:
      - "8080:80"
