# TLS-terminating reverse proxy for Raptorscope. Fronts the `web` (SPA + /api
# proxy) container over HTTPS. Bring your own cert (Let's Encrypt in production;
# a self-signed one for local testing — see deploy/tls/README.md).

# Redirect all plain HTTP to HTTPS.
server {
  listen 80;
  server_name _;
  return 301 https://$host$request_uri;
}

server {
  listen 443 ssl;
  http2 on;
  server_name _;

  ssl_certificate     /etc/nginx/certs/raptorscope.crt;
  ssl_certificate_key /etc/nginx/certs/raptorscope.key;
  ssl_protocols       TLSv1.2 TLSv1.3;
  ssl_ciphers         HIGH:!aNULL:!MD5;

  # Security headers.
  add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
  add_header X-Content-Type-Options "nosniff" always;
  add_header X-Frame-Options "DENY" always;
  add_header Referrer-Policy "no-referrer" always;

  # Everything (SPA + /api/*) goes to the web container, which already serves the
  # bundle and proxies /api to the API. TLS terminates here.
  location / {
    proxy_pass http://web:80;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto https;
    proxy_set_header X-Request-ID $request_id;
    # Let AI SSE streams (/api/cases/*/ai/summary/stream) flow through unbuffered.
    proxy_buffering off;
    proxy_read_timeout 600s;
  }
}
