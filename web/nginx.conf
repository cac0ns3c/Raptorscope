server {
  listen 80;
  root /usr/share/nginx/html;
  index index.html;

  # Proxy API calls to the raptorscope API container (strips the /api prefix).
  location /api/ {
    proxy_pass http://api:8000/;
    proxy_set_header Host $host;
  }

  # SPA history fallback.
  location / {
    try_files $uri /index.html;
  }
}
