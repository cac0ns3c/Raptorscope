[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "raptorscope"
version = "0.2.0"
description = "macOS DFIR analytics: Velociraptor collections -> ECS -> Elasticsearch with paired Sigma detections"
requires-python = ">=3.10"
license = "GPL-3.0-or-later"
dependencies = [
    "elasticsearch>=8.11,<9",
    "pysigma>=0.11",
    "pysigma-backend-elasticsearch>=1.1",
    "fastapi>=0.110",
    "uvicorn>=0.27",
    "anthropic>=0.40",
]

[project.scripts]
raptorscope = "raptorscope.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
filterwarnings = [
    "ignore:Using `httpx` with `starlette.testclient`:DeprecationWarning",
]

[tool.setuptools.package-data]
"*" = ["*.yml"]
