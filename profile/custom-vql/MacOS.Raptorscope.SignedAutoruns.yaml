# SPDX-License-Identifier: GPL-3.0-or-later
# Custom Velociraptor artifact — Autoruns persistence enriched with code-signature
# trust. Conforms to the Velociraptor artifact-contribution guidelines: named
# source, darwin precondition, author + reference. Run `velociraptor artifacts
# verify` before contributing.
name: MacOS.Raptorscope.SignedAutoruns
author: cac0ns3c (https://github.com/cac0ns3c/Raptorscope)
description: |
  Re-run `MacOS.Detection.Autoruns` and enrich each persistence item with
  code-signature trust — stock Autoruns emits a `Hash` but no signature, so
  detections for untrusted launch agents/daemons and hidden+unsigned login items
  can't fire from it alone. This artifact adds a `CodeSignature` object per
  persistence program via `codesign`.
  Keywords: persistence, autoruns, launchd, login items, code signing, macOS.
  MITRE T1543 / T1547.

  ### Output
  Autoruns rows plus a `CodeSignature{Exists,Trusted,SubjectName}` column.
  Consumed by raptorscope's `normalize_autoruns` (stem `autoruns`).
type: CLIENT
reference:
  - https://attack.mitre.org/techniques/T1543/001/
  - https://developer.apple.com/library/archive/documentation/Security/Conceptual/CodeSigningGuide/Introduction/Introduction.html
column_types:
  - name: Mtime
    type: timestamp
sources:
  - name: SignedAutoruns
    precondition: SELECT OS FROM info() WHERE OS = 'darwin'
    query: |
      LET items = SELECT * FROM Artifact.MacOS.Detection.Autoruns()
      -- Resolve the payload program (LaunchdConfig.Program / ProgramArguments[0]
      -- / Program) and check its signature. `codesign --verify --strict` exits 0
      -- only for a valid, trusted signature.
      SELECT *,
        dict(
          Exists=NOT (verify.Stderr =~ "code object is not signed"),
          Trusted=(verify.ReturnCode = 0),
          SubjectName=parse_string_with_regex(
            string=disp.Stderr,
            regex="Authority=(?P<A>[^\\n]+)").A
        ) AS CodeSignature
      FROM foreach(row=items, query={
        LET prog = LaunchdConfig.Program || LaunchdConfig.ProgramArguments[0] || Program
        SELECT *,
          { SELECT * FROM execve(argv=["codesign", "--verify", "--strict", prog]) } AS verify,
          { SELECT * FROM execve(argv=["codesign", "-dv", prog]) } AS disp
        FROM scope()
      })
