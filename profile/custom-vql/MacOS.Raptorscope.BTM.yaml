# Custom Velociraptor artifact — macOS Background Task Management (BTM) items.
# Conforms to the Velociraptor artifact-contribution guidelines
# (https://www.velociraptor-docs.org/dev/contributing-artifacts/): named source,
# darwin precondition, author + reference, typed timestamp column. Reformat via the
# GUI "Reformat VQL" and run `velociraptor artifacts verify` before contributing.
name: MacOS.Raptorscope.BTM
author: cac0ns3c (https://github.com/cac0ns3c/Raptorscope)
description: |
  Enumerate macOS Background Task Management (BTM) persistence items via
  `sfltool dumpbtm` — the launch agents/daemons and login items registered in the
  macOS 13+ BTM database, with developer name, disposition, and hash. There is no
  standard built-in for BTM, so raptorscope ships this one.
  Keywords: persistence, launchd, login items, btm, sfltool, macOS. MITRE T1543 / T1547.

  ### Output
  One row per BTM item (Path, ItemName, DeveloperName, Disabled, Type, UUID, Hash,
  Mtime). Consumed by raptorscope's `normalize_btm` (stem `btm_items`).
type: CLIENT
reference:
  - https://attack.mitre.org/techniques/T1547/015/
  - https://www.objective-see.org/blog/blog_0x7B.html
column_types:
  - name: Mtime
    type: timestamp
sources:
  - name: BTM
    precondition: SELECT OS FROM info() WHERE OS = 'darwin'
    query: |
      -- Bound the run: `sfltool dumpbtm` can hang without privileges, and macOS
      -- has no `timeout` binary, so wrap it in a shell background-kill (30s). It
      -- degrades to empty output instead of stalling the whole collection.
      LET dump = SELECT Stdout FROM execve(argv=["/bin/sh", "-c",
        "sfltool dumpbtm & P=$!; (sleep 30; kill -9 $P 2>/dev/null) & K=$!; wait $P 2>/dev/null; kill $K 2>/dev/null"])
      -- One record per BTM item; fields parsed from the dumpbtm block.
      SELECT
        Path,
        ItemName,
        DeveloperName,
        Disabled,
        Type,
        UUID,
        Hash,
        Mtime
      FROM parse_records_with_regex(
        accessor="data",
        file=dump.Stdout,
        regex="(?ms)Path:\\s+(?P<Path>.+?)\\n.+?"
              + "Name:\\s+(?P<ItemName>.+?)\\n.+?"
              + "Developer Name:\\s+(?P<DeveloperName>.+?)\\n.+?"
              + "Disposition:\\s+(?P<Disabled>.+?)\\n")
