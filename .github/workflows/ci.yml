name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  python:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install -e .
      - name: Test
        run: python -m pytest tests/ -q

  web:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      - name: Typecheck + unit tests
        run: npm run verify
      - name: Production build
        run: npm run build

  # End-to-end: Playwright drives the built SPA against the offline sample backend.
  e2e:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install raptorscope (for the API server)
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install -e .
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: Install web deps + build the SPA
        working-directory: web
        run: |
          npm ci
          npm run build
      - name: Install Playwright (chromium)
        working-directory: web
        run: npx playwright install --with-deps chromium
      - name: Run e2e (+ capture showcase screenshots & tour video)
        working-directory: web
        env:
          CI: "true"
        run: npm run e2e
      - name: Build walkthrough GIF from the tour video
        if: always()
        working-directory: web
        run: |
          webm=$(find test-results -name '*.webm' 2>/dev/null | head -1)
          echo "tour video: ${webm:-<none>}"
          if [ -n "$webm" ]; then
            mkdir -p screenshots
            ffmpeg -y -i "$webm" \
              -vf "fps=12,scale=1000:-1:flags=lanczos,split[s0][s1];[s0]palettegen=stats_mode=diff[p];[s1][p]paletteuse=dither=sierra2_4a" \
              -loop 0 screenshots/walkthrough.gif
            ls -la screenshots/walkthrough.gif
          fi
      - name: Upload SPA screenshots + walkthrough GIF
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: spa-screenshots
          path: web/screenshots/
          if-no-files-found: warn

  # Supply-chain: pinned deps, dependency-vuln scans, SBOM, filesystem scan.
  # See docs/SUPPLY-CHAIN.md for the triaged findings (diskcache CVE, dev-only npm).
  security:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: Install (pinned)
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.lock
          pip install -e . pip-audit cyclonedx-bom
      - name: Audit Python deps
        # CVE-2025-69872: unfixable transitive diskcache via pySigma; precondition
        # (attacker write access to the cache dir) not reachable — see docs/SUPPLY-CHAIN.md
        run: pip-audit --ignore-vuln CVE-2025-69872
      - name: Audit production web deps
        working-directory: web
        run: |
          npm ci
          npm audit --omit=dev --audit-level=high
      - name: Generate CycloneDX SBOM
        run: cyclonedx-py environment $(python -c "import sys;print(sys.prefix)") > sbom.json
      - uses: actions/upload-artifact@v4
        with:
          name: sbom
          path: sbom.json
      - name: Trivy filesystem scan
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          scan-type: fs
          scan-ref: .
          severity: HIGH,CRITICAL
          exit-code: "0" # report only; findings are triaged in docs/SUPPLY-CHAIN.md

  # Live-Elasticsearch integration: exercises ingest + the ES-backed store,
  # aggregations, pagination, and the ES-native detector parity (Phase B).
  integration:
    runs-on: ubuntu-latest
    services:
      elasticsearch:
        image: docker.elastic.co/elasticsearch/elasticsearch:8.13.4
        env:
          discovery.type: single-node
          xpack.security.enabled: "false"
          ES_JAVA_OPTS: "-Xms512m -Xmx512m"
        ports:
          - 9200:9200
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install -e .
      - name: Wait for Elasticsearch
        run: |
          for i in $(seq 1 30); do
            curl -sf http://localhost:9200/_cluster/health && break
            sleep 5
          done
      - name: Ingest the bundled sample
        run: python -m raptorscope ingest samples/mac-victim --es http://localhost:9200
      - name: Ingest smoke (doc count > 0)
        run: |
          sleep 2
          COUNT=$(curl -s 'http://localhost:9200/raptorscope-*/_count' | python -c "import sys,json;print(json.load(sys.stdin)['count'])")
          echo "indexed $COUNT docs"; test "$COUNT" -gt 0
      - name: ES-native detector parity + ES store paths
        env:
          RAPTORSCOPE_TEST_ES: http://localhost:9200
        run: python -m pytest tests/detect/test_es_detector_parity.py -q -rs
