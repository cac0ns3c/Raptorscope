# SPDX-License-Identifier: GPL-3.0-or-later
name: Release

# Publishes the wheel + sdist to PyPI on a version tag (e.g. v0.2.0), using
# PyPI Trusted Publishing (OIDC) — no API token secret required. Configure the
# publisher once at https://pypi.org/manage/project/raptorscope/settings/publishing/
on:
  push:
    tags: ["v*"]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Build sdist + wheel
        run: |
          python -m pip install --upgrade build
          python -m build
      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/

  publish:
    needs: build
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write # OIDC token for Trusted Publishing
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/
      - uses: pypa/gh-action-pypi-publish@release/v1
