title: macOS screensaver password prompt disabled via defaults write
id: b67332a2-8821-4486-b303-d16befe58ea6
status: experimental
description: >
  A live process writing the `com.apple.screensaver askForPassword` preference to
  a disabling value. Turning off the screensaver/lock-screen password requirement
  is a registry-equivalent settings change that removes an access control, leaving
  an unlocked session an adversary (or a returning operator) can reuse.
logsource:
  product: macos
  service: process
detection:
  selection:
    event.dataset: macos.process
    process.command_line|contains:
      - 'defaults write'
  domain:
    process.command_line|contains:
      - 'com.apple.screensaver'
  disable:
    process.command_line|contains:
      - 'askForPassword -int 0'
      - 'askForPassword -bool false'
      - 'askForPassword -bool NO'
  condition: selection and domain and disable
falsepositives:
  - A user or kiosk/presentation configuration intentionally disabling the lock-screen password on a trusted machine
level: medium
tags:
  - attack.defense_evasion
  - attack.t1112
