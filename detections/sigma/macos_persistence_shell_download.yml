title: macOS persistence item runs a shell download one-liner
id: 17a3ec28-000c-4000-a000-0000000c0ded
status: experimental
description: >
  A persistence entry (launch agent/daemon, login item, cron, BTM) whose command
  line pipes a network fetch into a shell or decodes base64 — the canonical
  "curl | bash" persistence + staging pattern, regardless of persistence type.
logsource:
  product: macos
  service: persistence
detection:
  selection:
    event.dataset: macos.persistence
    process.command_line|contains:
      - 'curl '
      - 'wget '
      - base64
      - "| bash"
      - "| sh"
  # cron persistence with a download payload is covered by the dedicated
  # cron_suspicious_command rule — exclude it here so the same event doesn't
  # double-alert (both were level:high, attack.persistence).
  filter_cron:
    raptorscope.persistence.type: cron
  condition: selection and not filter_cron
falsepositives:
  - Admin bootstrap scripts that legitimately fetch and run installers
level: high
tags:
  - attack.persistence
  - attack.execution
  - attack.t1059.004
