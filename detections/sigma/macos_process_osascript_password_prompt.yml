title: macOS fake password prompt via osascript hidden-answer dialog
id: 87b637a5-dfe2-47ae-8db9-5c0081daf9d3
status: experimental
description: >
  An osascript invocation that renders a GUI `display dialog` with a masked
  (`hidden answer`) input field. This is the standard technique for phishing the
  logged-in user's account password with a native-looking prompt, capturing the
  cleartext credential in-line without touching the keychain.
logsource:
  product: macos
  service: process
detection:
  tool:
    event.dataset: macos.process
    process.command_line|contains:
      - 'osascript'
  dialog:
    process.command_line|contains:
      - 'display dialog'
  hidden:
    process.command_line|contains:
      - 'hidden answer'
  condition: tool and dialog and hidden
falsepositives:
  - A legitimate installer or admin helper that prompts for a password via AppleScript (uncommon on an endpoint capture; usually paired with a signed installer)
level: high
tags:
  - attack.credential_access
  - attack.t1056.002
