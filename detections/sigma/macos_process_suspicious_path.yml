title: macOS process running from a suspicious path
id: a0f6d5c1-0005-4000-a000-0000000c0de6
status: experimental
description: >
  A running process whose executable lives in a world-writable or temporary
  staging directory (/tmp, /private/tmp, /Users/Shared). Legitimate software
  runs from /Applications, /System, or /usr; execution from these paths is a
  strong indicator of a dropped payload or stager.
logsource:
  product: macos
  service: process
detection:
  selection:
    event.dataset: macos.process
    process.executable|contains:
      - /tmp/
      - /Users/Shared/
  # Also catch interpreter-staged payloads (e.g. `bash /tmp/x.sh`).
  selection_cmd:
    event.dataset: macos.process
    process.command_line|contains:
      - /tmp/
      - /Users/Shared/
  # Drop signed Installer/updater temp execs; degrades safely when signature
  # is absent (real Pslist), where the rule stays path-only.
  filter_signed:
    process.code_signature.trusted: true
  condition: (selection or selection_cmd) and not filter_signed
falsepositives:
  - Developer/build tooling executed from a temporary directory
level: high
tags:
  - attack.execution
  - attack.t1204.002
