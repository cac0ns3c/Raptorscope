title: macOS password policy discovery via pwpolicy
id: aebdda9d-0fbd-40e4-8d36-0605a7fb7853
status: experimental
description: >
  A process reading the local or per-account password policy with `pwpolicy
  getaccountpolicies` / `getglobalpolicy`. Attackers query complexity, lockout and
  expiry rules to tune credential-guessing and understand account-lockout risk
  before brute forcing. Keyed to the get/read verbs so that policy-setting
  administration is not the trigger.
logsource:
  product: macos
  service: process
detection:
  selection:
    event.dataset: macos.process
    process.command_line|contains:
      - 'pwpolicy getaccountpolicies'
      - 'pwpolicy -getaccountpolicies'
      - 'pwpolicy getglobalpolicy'
      - 'pwpolicy -getglobalpolicy'
      - 'pwpolicy get-effective-policy'
  condition: selection
falsepositives:
  - Compliance/MDM agents auditing password policy
level: medium
tags:
  - attack.discovery
  - attack.t1201
