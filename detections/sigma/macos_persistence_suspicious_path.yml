title: macOS persistence program in suspicious path
id: 5a1e0b7c-0000-4000-a000-0000000c0de1
status: experimental
description: >
  A launch agent/daemon whose plist path OR whose payload (Program/
  ProgramArguments) resides in a world-writable or staging directory (/tmp,
  /private/tmp, /Users/Shared) — a common macOS persistence staging location.
  Matching the payload catches the dominant technique: a plist in a normal
  directory that points at a binary in /tmp.
logsource:
  product: macos
  service: persistence
detection:
  # startswith (not contains) so legit /var/tmp caches don't match /tmp/.
  selection_path:
    event.dataset: macos.persistence
    raptorscope.persistence.type:
      - launch_agent
      - launch_daemon
    file.path|startswith:
      - /tmp/
      - /private/tmp/
      - /Users/Shared/
  selection_payload:
    event.dataset: macos.persistence
    raptorscope.persistence.type:
      - launch_agent
      - launch_daemon
    process.command_line|contains:
      - /tmp/
      - /private/tmp/
      - /Users/Shared/
  condition: selection_path or selection_payload
falsepositives:
  - Legitimate installers that briefly stage helper plists in shared paths
level: high
tags:
  - attack.persistence
  - attack.t1543.001
  - attack.t1543.004
