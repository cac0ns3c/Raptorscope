title: macOS outbound connection to an IRC C2 port
id: bc637030-d927-4f74-860b-35092cdaaf5a
status: experimental
description: >
  An outbound connection targets a classic IRC port (6660-6669, 6697 TLS, 7000).
  IRC remains a long-lived botnet/C2 command channel. Legitimate IRC use on a
  managed macOS endpoint is rare, so a session to these ports warrants triage.
logsource:
  product: macos
  service: network
detection:
  selection:
    event.dataset: macos.network
    network.direction: egress
    destination.port:
      - 6660
      - 6661
      - 6662
      - 6663
      - 6664
      - 6665
      - 6666
      - 6667
      - 6668
      - 6669
      - 6697
      - 7000
  condition: selection
falsepositives:
  - A user running a legitimate IRC client (irssi, WeeChat, Textual).
level: medium
tags:
  - attack.command_and_control
  - attack.t1071
