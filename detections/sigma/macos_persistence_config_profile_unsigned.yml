title: macOS unsigned configuration profile installed
id: 8d4b3eaf-0003-4000-a000-0000000c0de4
status: experimental
description: >
  A configuration/MDM profile installed without a signer. Legitimate MDM and
  enterprise profiles are signed; an unsigned profile carrying a content-filter,
  proxy, or certificate payload is a persistence / traffic-interception risk.
logsource:
  product: macos
  service: persistence
detection:
  selection:
    event.dataset: macos.persistence
    raptorscope.persistence.type: config_profile
    raptorscope.persistence.signed: false
  # Scope to interception/persistence payloads — an unsigned MDM profile alone is
  # noisy (MDM profiles are stored unwrapped and look unsigned).
  payloads:
    raptorscope.persistence.payload_type|contains:
      - webcontent-filter
      - proxy
      - security
      - vpn
  condition: selection and payloads
falsepositives:
  - Manually installed developer or test profiles
  - MDM-delivered profiles are stored unwrapped and may appear unsigned; scoping
    by payload type reduces but does not fully eliminate this
level: medium
tags:
  - attack.persistence
  - attack.t1547
  - attack.t1553
