title: macOS known credential dumping tool execution
id: 55539140-39b1-4a48-95f0-0c3c648afc1b
status: experimental
description: >
  Execution referencing a named offensive credential-dumping tool for macOS
  (LaZagne, chainbreaker, keychaindump). These tools exist only to extract
  keychain and browser secrets, so their presence on argv is a high-confidence
  credential access indicator.
logsource:
  product: macos
  service: process
detection:
  selection:
    event.dataset: macos.process
    process.command_line|contains:
      - 'LaZagne'
      - 'lazagne'
      - 'chainbreaker'
      - 'keychaindump'
  condition: selection
falsepositives:
  - A security team running these tools during an authorized red-team or validation exercise
level: high
tags:
  - attack.credential_access
  - attack.t1555
