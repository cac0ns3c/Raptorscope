title: macOS browser credential store access
id: 4f3f9420-284f-42b6-94d6-5d9dbac9715f
status: experimental
description: >
  A non-browser process referencing a browser's saved-credential database by its
  exact filename (Chrome/Edge/Brave `Login Data`, Firefox `key4.db`/`logins.json`,
  Safari `Cookies.binarycookies`). Reading these files off-process (e.g. via
  sqlite3, cp, or an infostealer) is a common path to harvest stored passwords and
  session cookies.
logsource:
  product: macos
  service: process
detection:
  selection:
    event.dataset: macos.process
    process.command_line|contains:
      - 'Login Data'
      - 'key4.db'
      - 'logins.json'
      - 'Cookies.binarycookies'
  condition: selection
falsepositives:
  - A profile/backup or browser-migration utility that opens these files by path (uncommon; the browser itself accesses them via its own process, not by passing the path on argv)
level: high
tags:
  - attack.credential_access
  - attack.t1555.003
