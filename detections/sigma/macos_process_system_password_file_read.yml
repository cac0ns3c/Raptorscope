title: macOS sensitive password file access
id: 122a7136-562a-4a52-b6fd-4126b84489d5
status: experimental
description: >
  A process referencing a system password store that holds crackable secrets:
  `/etc/master.passwd` (local account hashes) or `/etc/kcpassword` (the obfuscated
  auto-login password). These files are not touched during normal user activity,
  so any process naming them on argv is a strong OS credential dumping signal.
logsource:
  product: macos
  service: process
detection:
  selection:
    event.dataset: macos.process
    process.command_line|contains:
      - '/etc/master.passwd'
      - '/etc/kcpassword'
  condition: selection
falsepositives:
  - An administrator or DirectoryService diagnostic manually inspecting local account storage (rare)
level: high
tags:
  - attack.credential_access
  - attack.t1003.008
